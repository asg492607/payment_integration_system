<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ASG Payment Gateway Cashier Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8faff;
      --surface: #ffffff;
      --surface2: #f1f5f9;
      --border: #e2e8f0;
      --border-glow: rgba(37, 99, 235, 0.25);
      --emerald: #10b981;
      --emerald-lt: #059669;
      --text-1: #0f172a;
      --text-2: #334155;
      --text-3: #64748b;
      --indigo: #2563eb;
      --indigo-dk: #1d4ed8;
      --radius: 16px;
      --shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text-1); min-height: 100vh; padding: 20px 16px; }
    
    .container { max-width: 620px; margin: 0 auto; }
    
    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--border);
      flex-wrap: wrap; gap: 12px;
    }
    .title { font-size: 1.35rem; font-weight: 800; display: flex; align-items: center; gap: 10px; color: var(--text-1); }
    .badge {
      background: #ecfdf5; color: var(--emerald-lt); border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 4px 10px; border-radius: 100px; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.5px;
    }
    .btn-soundbox {
      background: #ffffff; border: 1px solid var(--border); color: var(--text-1);
      padding: 10px 18px; border-radius: 10px; cursor: pointer; font-weight: 700;
      display: flex; align-items: center; gap: 8px; font-size: 0.88rem; box-shadow: var(--shadow);
      transition: all 0.2s; min-height: 42px;
    }
    .btn-soundbox:hover { border-color: var(--indigo); color: var(--indigo); }
    
    .feed { display: flex; flex-direction: column; gap: 12px; }
    .event {
      background: #ffffff; border: 1px solid var(--border); border-radius: var(--radius);
      padding: 18px 20px; display: flex; justify-content: space-between; align-items: center;
      animation: slideIn 0.3s ease; border-left: 5px solid var(--emerald); box-shadow: var(--shadow);
    }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .amt { font-size: 1.8rem; font-weight: 900; color: var(--emerald-lt); letter-spacing: -0.5px; }
    .time { font-size: 0.8rem; color: var(--text-3); margin-top: 4px; font-weight: 500; }
    .empty {
      text-align: center; color: var(--text-3); padding: 60px 20px; background: #ffffff;
      border: 1px dashed var(--border); border-radius: var(--radius);
    }
    
    /* Toast */
    .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; max-width: calc(100vw - 40px); }
    .toast {
      background: var(--emerald); color: white; padding: 14px 22px; border-radius: 12px;
      font-weight: 700; box-shadow: 0 8px 24px rgba(16, 185, 129, 0.35); animation: slideUp 0.3s forwards;
    }
    @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">⚡ ASG Payment Gateway <span class="badge">CASHIER</span></div>
      <button class="btn-soundbox" id="btn-soundbox" onclick="toggleSoundbox()">🔇 Soundbox: OFF</button>
    </div>

    <div class="feed" id="feed">
      <div class="empty" id="empty-state">
        <div style="font-size:2.5rem; margin-bottom:12px">📡</div>
        <div style="font-size:1.1rem; font-weight:700; color:var(--text-2); margin-bottom:4px;">Waiting for payments...</div>
        <span style="font-size:0.85rem; color:var(--text-3);">Keep this window open to receive real-time audio and visual alerts.</span>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onChildAdded } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCCoQaBHkp6XBIXATmn34-c89h8auPTe24",
      databaseURL: "https://payment-2e43c-default-rtdb.firebaseio.com",
      projectId: "payment-2e43c"
    };

    const app = initializeApp(firebaseConfig);
    const rtdb = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const eId = urlParams.get('eid');

    if(!eId) {
      document.getElementById('feed').innerHTML = '<div class="empty">Invalid Link. Missing Enterprise ID.</div>';
    } else {
      const eventsRef = ref(rtdb, `events/${eId}`);
      onChildAdded(eventsRef, (snapshot) => {
        const evt = snapshot.val();
        if (evt && evt.type === 'PAYMENT_VERIFIED') {
          addEventToFeed(evt);
          if (window.soundboxEnabled) {
            playTTS(`Payment of rupees ${evt.amount} received.`);
          }
          showToast(`₹${evt.amount} Received!`);
        }
      });
    }

    function addEventToFeed(evt) {
      const empty = document.getElementById('empty-state');
      if(empty) empty.remove();
      
      const el = document.createElement('div');
      el.className = 'event';
      const timeStr = new Date(evt.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
      el.innerHTML = `
        <div>
          <div style="font-weight:700; font-size:1.05rem; color:var(--text-1);">Verified by ${evt.verifiedBy || 'System'}</div>
          <div class="time">Order: ${evt.orderId} • ${timeStr}</div>
        </div>
        <div class="amt">₹${evt.amount}</div>
      `;
      const feed = document.getElementById('feed');
      feed.insertBefore(el, feed.firstChild);
    }

    function showToast(msg) {
      const c = document.getElementById('toast-container');
      const t = document.createElement('div');
      t.className = 'toast';
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(() => { t.style.opacity=0; setTimeout(()=>t.remove(), 300); }, 4000);
    }
  </script>
  
  <script>
    window.soundboxEnabled = false;
    function toggleSoundbox() {
      window.soundboxEnabled = !window.soundboxEnabled;
      const btn = document.getElementById('btn-soundbox');
      if (window.soundboxEnabled) {
        btn.innerHTML = '🔊 Soundbox: ON';
        btn.style.background = 'var(--indigo)';
        btn.style.color = '#ffffff';
        btn.style.borderColor = 'var(--indigo)';
        playTTS("Virtual Soundbox Activated for Cashier.");
      } else {
        btn.innerHTML = '🔇 Soundbox: OFF';
        btn.style.background = '#ffffff';
        btn.style.color = 'var(--text-1)';
        btn.style.borderColor = 'var(--border)';
      }
    }

    function playTTS(text) {
      if (!('speechSynthesis' in window)) return;
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-IN';
      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
