<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ASG Payment Gateway POS Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #f8faff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-dk: #1d4ed8;
      --success: #10b981;
      --card-bg: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }
    
    .screen {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.4s ease, transform 0.4s ease; transform: scale(0.96);
      padding: 24px 16px; overflow-y: auto;
    }
    .screen.active { opacity: 1; pointer-events: auto; transform: scale(1); }
    
    .glow {
      position: absolute; width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.12) 0%, transparent 60%);
      z-index: -1; pointer-events: none; animation: pulse 6s infinite alternate;
    }
    @keyframes pulse { 0% { transform: scale(0.9); opacity: 0.1; } 100% { transform: scale(1.2); opacity: 0.2; } }

    .brand-name { font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 900; letter-spacing: -1px; margin-bottom: 16px; color: var(--text); text-align: center; }
    .subtitle { font-size: clamp(1.1rem, 3vw, 1.5rem); color: var(--text-muted); font-weight: 600; text-align: center; }
    
    /* Waiting Screen (Split layout) */
    .qr-container { display: flex; max-width: 1000px; width: 92%; gap: 24px; align-items: stretch; margin: 0 auto; }
    .receipt-card {
      background: var(--card-bg); border: 1px solid var(--border); padding: 32px; border-radius: 20px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05); flex: 1; display: flex; flex-direction: column; max-height: 80vh; overflow-y: auto;
    }
    .receipt-title {
      font-size: 1.2rem; font-weight: 800; color: var(--text-muted); margin-bottom: 18px;
      text-transform: uppercase; letter-spacing: 1.5px; border-bottom: 1px dashed var(--border); padding-bottom: 10px;
    }
    .receipt-items { flex: 1; margin-bottom: 20px; }
    .receipt-item { display: flex; justify-content: space-between; font-size: 1.1rem; margin-bottom: 12px; }
    .receipt-item-name { font-weight: 600; color: var(--text); }
    .receipt-item-price { font-weight: 800; color: var(--text); }
    .receipt-total-row {
      display: flex; justify-content: space-between; font-size: 1.6rem; font-weight: 900;
      border-top: 1px dashed var(--border); padding-top: 18px; color: var(--primary);
    }
    
    .qr-card {
      background: var(--card-bg); border: 1px solid var(--border); padding: 36px 30px; border-radius: 20px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.05); text-align: center; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .amount { font-size: clamp(2.4rem, 5vw, 3.5rem); font-weight: 900; color: var(--primary); line-height: 1; margin-bottom: 20px; letter-spacing: -1px; }
    .qr-box {
      background: white; padding: 16px; border-radius: 16px; margin: 0 auto; display: inline-block;
      border: 1px solid var(--border); box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
    }
    .instruction { margin-top: 20px; font-size: 1.05rem; font-weight: 600; color: var(--text-muted); }
    
    /* Success Screen */
    .screen-success { background: #10b981; z-index: 100; color: white; }
    .checkmark {
      width: 140px; height: 140px; border-radius: 50%; background: white;
      display: flex; align-items: center; justify-content: center; margin-bottom: 30px;
      animation: scaleIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; transform: scale(0);
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }
    .checkmark svg { width: 70px; height: 70px; color: #10b981; }
    .success-text { font-size: clamp(2.2rem, 6vw, 3.8rem); font-weight: 900; color: white; margin-bottom: 8px; }
    .success-sub { font-size: clamp(1.2rem, 3vw, 1.6rem); color: rgba(255,255,255,0.95); font-weight: 600; }
    
    @keyframes scaleIn { to { transform: scale(1); } }

    @media (max-width: 768px) {
      .qr-container { flex-direction: column; gap: 16px; width: 100%; }
      .receipt-card { max-height: 40vh; padding: 20px; }
      .qr-card { padding: 24px 16px; }
      .amount { font-size: 2.5rem; }
    }
  </style>
</head>
<body>

  <div class="glow"></div>

  <!-- Screen 1: Idle -->
  <div class="screen active" id="screen-idle">
    <div class="brand-name" id="idle-brand">ASG Payment Gateway</div>
    <div class="subtitle">Ready for next customer</div>
  </div>

  <!-- Screen 2: QR Waiting (Split) -->
  <div class="screen" id="screen-qr">
    <div class="brand-name" id="qr-brand" style="font-size: clamp(1.4rem, 4vw, 2.2rem); margin-bottom: 16px;">ASG Payment Gateway</div>
    <div class="qr-container">
      <!-- Itemized Receipt -->
      <div class="receipt-card" id="receipt-card">
        <div class="receipt-title">Order Summary</div>
        <div class="receipt-items" id="receipt-items">
          <!-- Filled by JS -->
        </div>
        <div class="receipt-total-row">
          <span>Total</span>
          <span id="receipt-total">₹0.00</span>
        </div>
      </div>
      
      <!-- QR Code -->
      <div class="qr-card">
        <div class="amount" id="display-amount">₹0.00</div>
        <div class="qr-box" id="qrcode"></div>
        <div class="instruction">Scan with any UPI app to pay</div>
      </div>
    </div>
  </div>

  <!-- Screen 3: Success -->
  <div class="screen screen-success" id="screen-success">
    <div class="checkmark">
      <svg fill="none" stroke="currentColor" stroke-width="4" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
    </div>
    <div class="success-text">Payment Successful!</div>
    <div class="success-sub">Thank you for your payment</div>
    <div style="margin-top: 30px; background: rgba(255,255,255,0.2); padding: 18px 24px; border-radius: 16px; backdrop-filter: blur(8px); text-align: center;">
      <div style="color: white; font-weight: 700; margin-bottom: 12px; font-size: 1.05rem;">Scan for Digital Receipt</div>
      <div id="receipt-qrcode" style="background: white; padding: 10px; border-radius: 10px; display: inline-block;"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onValue, onChildAdded } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCCoQaBHkp6XBIXATmn34-c89h8auPTe24",
      databaseURL: "https://payment-2e43c-default-rtdb.firebaseio.com",
      projectId: "payment-2e43c"
    };

    const app = initializeApp(firebaseConfig);
    const rtdb = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const eId = urlParams.get('eid');
    let brandColor = '#2563eb';
    let brandName = 'Verified Merchant';

    // UI Switching
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    // Audio Alert
    function playAudioAlert(amount) {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(`Payment of rupees ${amount} received.`);
        utterance.lang = 'en-IN';
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    if (!eId) {
      document.getElementById('idle-brand').textContent = 'Invalid Link';
    } else {
      // 1. Fetch Branding
      fetch(`/api/auth/merchant/${eId}`).then(r => r.json()).then(data => {
        if(data.success) {
          brandColor = data.brand_color || '#2563eb';
          brandName = data.brand_name || 'Verified Merchant';
          document.documentElement.style.setProperty('--primary', brandColor);
          document.getElementById('idle-brand').textContent = brandName;
          document.getElementById('qr-brand').textContent = brandName;
        }
      }).catch(e=>{});

      // 2. Listen for POS State changes (from cashier)
      const stateRef = ref(rtdb, `pos_state/${eId}`);
      onValue(stateRef, (snapshot) => {
        const state = snapshot.val();
        if(!state) return showScreen('screen-idle');

        if(state.status === 'idle') {
          showScreen('screen-idle');
        } 
        else if(state.status === 'waiting' && state.upiLink) {
          // Render QR
          document.getElementById('display-amount').textContent = `₹${parseFloat(state.amount).toFixed(2)}`;
          document.getElementById('qrcode').innerHTML = ''; // clear old
          new QRCode(document.getElementById("qrcode"), {
            text: state.upiLink, width: 260, height: 260,
            colorDark : "#0f172a", colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
          });
          
          // Render Receipt if cartItems exist
          const receiptCard = document.getElementById('receipt-card');
          const receiptItems = document.getElementById('receipt-items');
          if (state.cartItems && state.cartItems.length > 0) {
            receiptCard.style.display = 'flex';
            let html = '';
            state.cartItems.forEach(item => {
               const itemTotal = item.qty * parseFloat(item.price);
               html += `<div class="receipt-item">
                 <span class="receipt-item-name">${item.qty}x ${item.name}</span>
                 <span class="receipt-item-price">₹${itemTotal.toFixed(2)}</span>
               </div>`;
            });
            receiptItems.innerHTML = html;
            document.getElementById('receipt-total').textContent = `₹${parseFloat(state.amount).toFixed(2)}`;
          } else {
            receiptCard.style.display = 'none';
          }
          
          showScreen('screen-qr');
        }
      });

      // 3. Listen for Payment Verification Events
      const eventsRef = ref(rtdb, `events/${eId}`);
      onChildAdded(eventsRef, (snapshot) => {
        const evt = snapshot.val();
        const activeScreen = document.querySelector('.screen.active');
        if (evt && evt.type === 'PAYMENT_VERIFIED' && activeScreen.id === 'screen-qr') {
          document.getElementById('receipt-qrcode').innerHTML = '';
          if (evt.orderId) {
            new QRCode(document.getElementById("receipt-qrcode"), {
              text: `${window.location.origin}/invoice/${evt.orderId}`,
              width: 140, height: 140,
              colorDark : "#0f172a", colorLight : "#ffffff",
              correctLevel : QRCode.CorrectLevel.M
            });
          }

          showScreen('screen-success');
          playAudioAlert(evt.amount);
          
          // Auto-reset back to idle after 15 seconds
          setTimeout(() => {
            fetch('/api/admin/pos/clear', {
              method: 'POST',
              headers: { 'Authorization': `Bearer ${localStorage.getItem('admin_token')}` }
            }).catch(e=>{});
            showScreen('screen-idle');
          }, 15000);
        }
      });
    }
    
    // Initial click to enable audio policy
    document.body.addEventListener('click', () => {
      if ('speechSynthesis' in window) {
        let u = new SpeechSynthesisUtterance('');
        u.volume = 0; window.speechSynthesis.speak(u);
      }
    }, { once: true });
  </script>
</body>
</html>
